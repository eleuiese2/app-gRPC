apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: sim-demo
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":50051}]'
spec:
  type: NodePort
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
