apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: sim-demo
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: 185542568106.dkr.ecr.us-east-1.amazonaws.com/sim-ecr/app1:latest
          ports:
            - containerPort: 50051
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: sim-demo
  labels:
    app: app1
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 50051
      protocol: TCP
  type: NodePort
