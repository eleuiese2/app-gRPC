apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: sim-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: 185542568106.dkr.ecr.us-east-1.amazonaws.com/sim-ecr/app2:latest
          ports:
            - containerPort: 50051
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: sim-demo
  labels:
    app: app2
spec:
  selector:
    app: app2
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
